services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_api_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-electro_pi}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      MAIL_MAILER: ${MAIL_MAILER:-log}
      L5_SWAGGER_CONST_HOST: ${APP_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - task_api

  nginx:
    image: nginx:alpine
    container_name: task_api_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - task_api

  db:
    image: mysql:8.0
    container_name: task_api_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-electro_pi}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - task_api

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_api_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-electro_pi}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
    command: php artisan queue:work --tries=3 --timeout=60
    depends_on:
      db:
        condition: service_healthy
    networks:
      - task_api

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_api_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-electro_pi}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
    command: php artisan schedule:work
    depends_on:
      db:
        condition: service_healthy
    networks:
      - task_api

volumes:
  db_data:

networks:
  task_api:
    driver: bridge
